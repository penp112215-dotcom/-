# CloudBase AnyService 专用源站入口。
# AnyService 控制台填写：HTTP / 1.14.200.232:8080
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    client_max_body_size 2m;

    # 仅健康检查允许无 CloudBase 请求头访问，便于部署验证。
    location = /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        # AnyService 会向源站注入这些头；减少公网端口被直接误用的风险。
        # 这不是金融服务的公开访问入口。
        if ($http_x_wx_appid != "wx7fb5a8c99417a78b") { return 403; }
        if ($http_x_anyservice_name != "miniappvps") { return 403; }

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
    }
}
